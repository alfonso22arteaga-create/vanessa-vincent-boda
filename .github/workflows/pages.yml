name: Publicar galeria
on:
  push:
    branches: [main]
    paths: ['index.html', 'style.css', 'app.js', 'photos.js', 'cover.png', '*.zip']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar galeria
        run: |
          mkdir -p dist
          cp index.html style.css app.js photos.js cover.png dist/
          touch dist/.nojekyll
          for archive in photos-*.zip thumbs.zip; do unzip -q "$archive" -d dist; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
